name: Cycle
options:
  bundleIdPrefix: com.cycleapp
  deploymentTarget:
    iOS: "17.0"

targets:
  Cycle:
    type: application
    platform: iOS
    sources:
      - Cycle
    scheme:
      storeKitConfiguration: Cycle/Cycle.storekit
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cycleapp.cycle
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Cycle/Cycle.entitlements
      groups:
        - debug
        - release
      configs:
        debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: Cycle/Info.plist
      properties:
        CFBundleDisplayName: Cycle
        NSFaceIDUsageDescription: "Cycle uses Face ID to protect your private health data."
        NSHealthShareUsageDescription: "Cycle reads menstrual-flow entries from Apple Health when you choose to sync."
        NSHealthUpdateUsageDescription: "Cycle saves menstrual-flow entries to Apple Health when you choose to sync."
    entitlements:
      path: Cycle/Cycle.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cycleapp.shared
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    capabilities:
      HealthKit: true

  CycleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CycleTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycleapp.cycle.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cycle

  CycleWidgetExtension:
    type: app-extension
    platform: iOS
    product: CycleWidgetExtension
    sources:
      - CycleWidgetExtension
      - path: Cycle/Services/SharedData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycleapp.cycle.widget
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: CycleWidgetExtension/CycleWidgetExtension.entitlements
    info:
      path: CycleWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: CycleWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CycleWidgetExtension/CycleWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cycleapp.shared
    dependencies:
      - target: Cycle
        embed: false
        link: false

settingGroups:
  debug:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  release:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
